name: Atualizar catálogo

on:
  schedule:
    - cron: '17 6 * * *'   # todo dia, 03:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scraper/**', '.github/workflows/catalog.yml']

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar catálogo (recomp.gg + AllRecomps + Recompiled Games + WASM Arcade + GithubLauncher)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scraper/build-catalog.mjs
      - name: Repositórios (top 100 da história, top 100 dos últimos 2 meses, recomendados do Achado IA)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scraper/build-repos.mjs
      - name: O que cada jogo pede (ROM/ISO, região, versão, hash) lendo o README dos projetos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scraper/build-requirements.mjs
      - name: Downloads dos jogos (rankings da semana, do mês e de sempre)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scraper/build-stats.mjs
      - name: Commit se mudou
        run: |
          if git diff --quiet -- catalog/; then echo "Sem mudanças."; exit 0; fi
          git config user.name "hydrahub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/
          git commit -m "catálogo: atualização automática $(date -u +%F)"
          git pull --rebase origin main
          git push
